<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<div id="storybook-root"></div><div id="storybook-docs"></div>
<script>
  // 模擬說明頁五區都少畫最後一項（部位、狀態、可以這樣做、不要這樣做各少 1 項，無障礙 3 項只畫 2 項）；
  // 標題都在，畫出來的「看範例」都正確
  const DOCS = {
    'demo--docs':
      '<div class="ds-doc" data-ds-id="demo">' +
      '<h2 data-testid="ds-doc-anatomy">部位</h2>' +
      '<ol><li data-testid="ds-doc-anatomy-item">外框：可以點的範圍</li></ol>' +
      '<h2 data-testid="ds-doc-states">狀態</h2>' +
      '<table><tbody><tr data-testid="ds-doc-state-item"><td>預設</td><td>藍底</td></tr></tbody></table>' +
      '<h2 data-testid="ds-doc-dodont">可以這樣做、不要這樣做</h2>' +
      '<ul><li data-testid="ds-doc-do-item">撐滿寬度用 fullWidth <a href="./?path=/story/demo--full-width" data-story-id="demo--full-width">看範例</a></li></ul>' +
      '<ul><li data-testid="ds-doc-dont-item">不要巢狀 <a href="./?path=/story/demo--nested" data-story-id="demo--nested">看範例</a></li></ul>' +
      '<h2 data-testid="ds-doc-a11y">無障礙</h2>' +
      '<h3>網頁和 APP 都要做到</h3><dl class="ds-doc-a11y"><dt class="ds-doc-a11y__label">鍵盤</dt><dd><ul><li data-testid="ds-doc-a11y-item">Tab 移到元件</li><li data-testid="ds-doc-a11y-item">Enter 觸發</li></ul></dd></dl>' +
      '</div>',
  };
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  setTimeout(() => {
    if (params.get('viewMode') !== 'docs') {
      const story = document.createElement('div');
      story.textContent = '畫出 ' + id;
      document.getElementById('storybook-root').appendChild(story);
      return;
    }
    const el = document.createElement('div');
    el.className = 'sbdocs';
    el.innerHTML = DOCS[id];
    document.getElementById('storybook-docs').appendChild(el);
  }, 50);
</script>
</body></html>
